name: pdf_viewer
description: "A high-performance mobile PDF viewer app built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  syncfusion_flutter_pdfviewer: ^33.2.13
  file_picker: ^11.0.3
  google_fonts: ^8.2.1
  path_provider: ^2.1.6
  permission_handler: 11.3.1
  device_info_plus: ^12.4.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
